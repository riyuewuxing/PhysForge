<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-__SCRIPT_HASH__'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>PhysForge AI 密钥保险库 · 离线工具</title>
<style>
:root{color-scheme:dark;font:15px/1.55 system-ui,sans-serif;background:#0b1322;color:#e2e8f0}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:36px auto;padding:0 20px 36px}h1{font-size:26px;margin:0 0 8px}h2{font-size:17px;margin:0 0 12px}p{color:#b9c6d8}section{border:1px solid #334155;border-radius:12px;padding:18px;margin:18px 0;background:#111c2d}label{display:grid;gap:5px;margin:8px 0;font-size:13px;color:#cbd5e1}input,select,button{font:inherit;color:inherit;border:1px solid #475569;border-radius:7px;background:#0b1322;padding:8px 10px;min-width:0}input,select{width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#0e7490;border-color:#38bdf8;color:white;font-weight:700}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.profile{border-top:1px solid #334155;margin:14px 0;padding-top:8px}.profile:first-child{border:0}.muted{color:#94a3b8;font-size:13px}.warn{color:#fcd34d}.status{min-height:26px;overflow-wrap:anywhere}small{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>PhysForge AI 密钥保险库</h1>
<p>在你自己的电脑浏览器中离线生成加密文件。无需把 API Key 或保险库密码交给开发者。建议先下载本工具，断网后打开本地 HTML。</p>
<section><h2>1. 添加或编辑 AI 服务商</h2>
<div class="row"><button id="add" type="button">添加服务商</button><label>导入旧密文以修改<input id="import-file" type="file" accept=".json,application/json"></label><label>旧保险库密码<input id="old-password" type="password" autocomplete="off" maxlength="1024"></label><button id="import" type="button">解密导入</button></div>
<div id="profiles"></div></section>
<section><h2>2. 设置保险库密码</h2>
<label>主密码（至少 16 字符）<input id="password" type="password" autocomplete="new-password" maxlength="1024"></label>
<label>确认主密码<input id="confirm" type="password" autocomplete="new-password" maxlength="1024"></label>
<div class="row"><button id="random" type="button">生成随机恢复密码</button><button id="toggle" type="button">显示 / 隐藏密码</button></div>
<p class="warn">请自行安全保管主密码。忘记密码无法恢复。工具不保存明文，也不会自动上传任何内容。</p>
</section>
<section><h2>3. 生成并下载密文</h2>
<p class="muted">AES-256-GCM · PBKDF2-SHA256（600,000 次）· 每次随机盐和 IV。仅下载 ai-vault.enc.json。</p>
<div class="row"><button class="primary" id="encrypt" type="button">加密并下载</button><button id="clear" type="button">清空表单</button></div>
<div id="status" role="status" class="status"></div></section>
<p class="muted">工具不发起网络请求；页面仍依赖可信浏览器和运行环境。请勿将主密码与密文放在同一公开位置。</p>
</main><script type="module">__SCRIPT__</script></body></html>
