name: H88 exact-source S01 projector palette
on:
  pull_request:
    branches: ['polish/v31-h88-s01-projector']
permissions:
  contents: read
jobs:
  audit:
    if: startsWith(github.event.pull_request.head.ref, 'audit/h88-s01-projector')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: 49ec8ae3595ec02b844cc33e5baf1ec17635110d
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: |
          test "$(git -C source rev-parse HEAD)" = "49ec8ae3595ec02b844cc33e5baf1ec17635110d"
          cp audit/scripts/h88_s01_paper.mjs source/scripts/
          sha256sum source/scripts/h88_s01_paper.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: source
      - run: pnpm build
        working-directory: source
        env:
          VITE_BASE_PATH: /PhysForge/
      - run: node scripts/h88_s01_paper.mjs
        working-directory: source
        timeout-minutes: 5
        env:
          SOURCE_HEAD: 49ec8ae3595ec02b844cc33e5baf1ec17635110d
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h88-s01-paper-evidence
          path: |
            source/evidence/h88-s01-paper/*.png
            source/evidence/h88-s01-paper/report.json
          if-no-files-found: error
          retention-days: 7
