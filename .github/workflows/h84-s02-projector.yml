name: H84 exact-source S02 projector palette and interaction
on:
  pull_request:
    branches: ['polish/v31-h84-s02-projector-contrast']
permissions:
  contents: read
jobs:
  audit:
    if: startsWith(github.event.pull_request.head.ref, 'audit/h84-s02-projector-palette')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: 3d4cf5062dd464937a558f482b93fd2598c1939c
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: |
          test "$(git -C source rev-parse HEAD)" = "3d4cf5062dd464937a558f482b93fd2598c1939c"
          cp audit/scripts/h84_s02_projector.mjs source/scripts/
          sha256sum source/scripts/h84_s02_projector.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: source
      - run: pnpm build
        working-directory: source
        env:
          VITE_BASE_PATH: /PhysForge/
      - run: node scripts/h84_s02_projector.mjs
        working-directory: source
        timeout-minutes: 5
        env:
          SOURCE_HEAD: 3d4cf5062dd464937a558f482b93fd2598c1939c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h84-s02-projector-evidence
          path: |
            source/evidence/h84-s02/*.png
            source/evidence/h84-s02/report.json
          if-no-files-found: error
          retention-days: 7
