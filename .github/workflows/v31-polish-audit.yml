name: V3.1 visual and export audit
on:
  pull_request:
    branches: [main, 'polish/v31-*']
    paths:
      - 'simulations/**'
      - 'apps/web/src/components/RightControlPanel.tsx'
      - 'apps/web/src/components/SimulationStage.tsx'
      - 'apps/web/src/index.css'
      - 'packages/sim-sdk/src/visualKit*'
      - 'scripts/visual-audit.mjs'
      - 'scripts/visual_review_pack.py'
      - 'scripts/test_visual_review_pack.py'
      - '.github/workflows/v31-polish-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  visual:
    name: visual (${{ matrix.phase }})
    strategy:
      fail-fast: false
      matrix:
        phase: [online, offline]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: git diff --check HEAD^1 HEAD
      - run: pnpm build
        env:
          VITE_BASE_PATH: /PhysForge/
      - run: pnpm audit:visual
        env:
          PHYSFORGE_VISUAL_PHASE: ${{ matrix.phase }}
      - run: pnpm export:release --v3-audit
        if: ${{ always() && matrix.phase == 'offline' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-polish-visual-${{ matrix.phase }}
          path: artifacts/ui-audit/
          retention-days: 7

  base-review:
    name: Recover exact parent visual evidence (${{ matrix.phase }})
    strategy:
      fail-fast: false
      matrix:
        phase: [online, offline]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
        timeout-minutes: 2
      - run: python -m unittest discover -s scripts -p test_visual_review_pack.py
        timeout-minutes: 1
      - name: Resolve exact parent or recover legacy raw inside public runner
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_HEAD: ${{ github.event.pull_request.base.sha }}
          REVIEW_PHASE: ${{ matrix.phase }}
        run: python scripts/visual_review_pack.py --resolve-base --repo "$REVIEW_REPO" --head "$REVIEW_HEAD" --phase "$REVIEW_PHASE" --out artifacts/base-review --prefixes H53_F07,H56_F08
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/base-review/manifest.json') != '' }}
        with:
          name: v31-polish-base-manifest-${{ matrix.phase }}
          path: artifacts/base-review/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/base-review/review-01.zip') != '' }}
        with:
          name: v31-polish-base-review-${{ matrix.phase }}-01
          path: artifacts/base-review/review-01.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/base-review/review-02.zip') != '' }}
        with:
          name: v31-polish-base-review-${{ matrix.phase }}-02
          path: artifacts/base-review/review-02.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/base-review/review-03.zip') != '' }}
        with:
          name: v31-polish-base-review-${{ matrix.phase }}-03
          path: artifacts/base-review/review-03.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/base-review/review-04.zip') != '' }}
        with:
          name: v31-polish-base-review-${{ matrix.phase }}-04
          path: artifacts/base-review/review-04.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/base-review/review-05.zip') != '' }}
        with:
          name: v31-polish-base-review-${{ matrix.phase }}-05
          path: artifacts/base-review/review-05.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/base-review/review-06.zip') != '' }}
        with:
          name: v31-polish-base-review-${{ matrix.phase }}-06
          path: artifacts/base-review/review-06.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/base-review/review-07.zip') != '' }}
        with:
          name: v31-polish-base-review-${{ matrix.phase }}-07
          path: artifacts/base-review/review-07.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/base-review/review-08.zip') != '' }}
        with:
          name: v31-polish-base-review-${{ matrix.phase }}-08
          path: artifacts/base-review/review-08.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  review:
    name: Lossless bounded screenshot review (${{ matrix.phase }})
    needs: [visual, base-review]
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        phase: [online, offline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
        timeout-minutes: 2
      - uses: actions/download-artifact@v4
        with:
          name: v31-polish-visual-${{ matrix.phase }}
          path: artifacts/raw-review
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: v31-polish-base-manifest-${{ matrix.phase }}
          path: artifacts/base-manifest
      - name: Verify original PNGs, compare exact parent and split review payloads
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_PHASE: ${{ matrix.phase }}
        run: python scripts/visual_review_pack.py --raw artifacts/raw-review --out artifacts/small-review --head "$REVIEW_HEAD" --base-sha "$REVIEW_BASE" --phase "$REVIEW_PHASE" --baseline artifacts/base-manifest/manifest.json --prefixes H53_F07,H56_F08
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/small-review/manifest.json') != '' }}
        with:
          name: v31-polish-review-manifest-${{ matrix.phase }}
          path: artifacts/small-review/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('artifacts/small-review/review-01.zip') != '' }}
