name: H81 exact-source S02 preview
on:
  pull_request:
    branches: ['polish/v31-h81-s02-preview']
permissions:
  contents: read
jobs:
  audit:
    if: startsWith(github.event.pull_request.head.ref, 'audit/h81-s02-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: d1da4a40398269c2758801570d0ec8585cac53db
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: |
          test "$(git -C source rev-parse HEAD)" = "d1da4a40398269c2758801570d0ec8585cac53db"
          cp audit/scripts/h81_s02_preview.mjs source/scripts/
          sha256sum source/scripts/h81_s02_preview.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: source
      - run: pnpm build
        working-directory: source
        env:
          VITE_BASE_PATH: /PhysForge/
      - run: node scripts/h81_s02_preview.mjs
        working-directory: source
        timeout-minutes: 4
        env:
          SOURCE_HEAD: d1da4a40398269c2758801570d0ec8585cac53db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h81-s02-preview
          path: |
            source/evidence/h81-s02/*.png
            source/evidence/h81-s02/report.json
          if-no-files-found: error
          retention-days: 7
