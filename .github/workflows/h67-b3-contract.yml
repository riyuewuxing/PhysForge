name: H67 B3 actual geometry and visual contract
on:
  push:
    branches: [audit/v31-h67-b3-frame-final]
permissions:
  contents: read
jobs:
  b3:
    name: B3 optical interface (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        phase: [online, offline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          git diff --name-only HEAD^ HEAD | sort > /tmp/changed
          printf '%s\n' .github/workflows/h67-b3-contract.yml scripts/h67_b3_contract.mjs | sort | diff - /tmp/changed
          echo "SOURCE_HEAD=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        if: matrix.phase == 'online'
        env:
          VITE_BASE_PATH: /PhysForge/
        timeout-minutes: 3
      - run: node scripts/h67_b3_contract.mjs
        timeout-minutes: 5
        env:
          PHASE: ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h67-b3-${{ matrix.phase }}
          path: |
            evidence/b3-gold/*.png
            evidence/b3-gold/reference/*.png
            evidence/b3-gold/report.json
          if-no-files-found: error
          retention-days: 7
