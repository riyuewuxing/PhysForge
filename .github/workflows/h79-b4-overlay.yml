name: H79 exact-source B4 real DOM occlusion and manual camera
on:
  pull_request:
    branches: ['polish/v31-h79-b4-safe-frame']
permissions:
  contents: read
jobs:
  audit:
    if: startsWith(github.event.pull_request.head.ref, 'audit/h79-b4')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: 941804a2ef378a8d059460d9a4bf785fa360c306
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: |
          test "$(git -C source rev-parse HEAD)" = "941804a2ef378a8d059460d9a4bf785fa360c306"
          cp audit/scripts/h79_b4_overlay.mjs source/scripts/
          sha256sum source/scripts/h79_b4_overlay.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: source
      - run: pnpm build
        working-directory: source
        env:
          VITE_BASE_PATH: /PhysForge/
      - run: node scripts/h79_b4_overlay.mjs
        working-directory: source
        timeout-minutes: 4
        env:
          SOURCE_HEAD: 941804a2ef378a8d059460d9a4bf785fa360c306
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h79-b4-overlay
          path: |
            source/evidence/h79-b4/*.png
            source/evidence/h79-b4/report.json
          if-no-files-found: error
          retention-days: 7
