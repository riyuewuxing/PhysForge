name: H65 legacy offline scope independent replay
on:
  pull_request:
    branches: [main, 'polish/v31-*']
permissions:
  contents: read
jobs:
  legacy-scope:
    if: startsWith(github.event.pull_request.head.ref, 'polish/v31-h65-legacy-scope')
    name: Actual plot text ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        model: [builder-composite-em-field, em-induction-double-rod, stse-em-devices-suite, stse-tokamak-magnetic-mirror, astro-orbital-mechanics]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^)" = "37bc70b5bdeb1088bcd0c866d149cfb34e876da5"
          test "$(git hash-object scripts/h64_legacy_scope_audit.mjs)" = "16e6558021fa2c89d0afb88ca5ab2e625ea37301"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/h64_legacy_scope_audit.mjs
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-scope-${{ matrix.model }}
          path: |
            evidence/scope/*.png
            evidence/scope/report.json
          if-no-files-found: error
          retention-days: 7
