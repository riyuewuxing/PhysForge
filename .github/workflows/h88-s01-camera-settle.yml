name: H88 exact-source S01 camera settle
on:
  pull_request:
    branches: ['polish/v31-h88-s01-projector-camera-settle']
permissions:
  contents: read
jobs:
  audit:
    if: startsWith(github.event.pull_request.head.ref, 'audit/h88-s01-projector')
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: 4ed5f04f3b684f32724af90d3bc5cca389e8403d
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: |
          test "$(git -C source rev-parse HEAD)" = "4ed5f04f3b684f32724af90d3bc5cca389e8403d"
          cp audit/scripts/h88_s01_camera_settle.mjs source/scripts/
          sha256sum source/scripts/h88_s01_camera_settle.mjs
          git -C source diff --exit-code
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: source
      - run: pnpm build
        working-directory: source
        env:
          VITE_BASE_PATH: /PhysForge/
      - run: node scripts/h88_s01_camera_settle.mjs
        working-directory: source
        timeout-minutes: 6
        env:
          SOURCE_HEAD: 4ed5f04f3b684f32724af90d3bc5cca389e8403d
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h88-s01-camera-settle-evidence
          path: |
            source/evidence/h88-s01-paper/*.png
            source/evidence/h88-s01-paper/report.json
          if-no-files-found: error
          retention-days: 7
