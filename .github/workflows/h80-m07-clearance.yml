name: H80 exact-source M07 cone paint clearance
on:
  pull_request:
    branches: ['polish/v31-h80-m07-labels']
permissions:
  contents: read
jobs:
  audit:
    if: startsWith(github.event.pull_request.head.ref, 'audit/h80-m07')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: a3011aec9bbcf1e27721cdb7980120d04206932a
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: |
          test "$(git -C source rev-parse HEAD)" = "a3011aec9bbcf1e27721cdb7980120d04206932a"
          cp audit/scripts/h80_m07_clearance.mjs source/scripts/
          sha256sum source/scripts/h80_m07_clearance.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: source
      - run: pnpm build
        working-directory: source
        env:
          VITE_BASE_PATH: /PhysForge/
      - run: node scripts/h80_m07_clearance.mjs
        working-directory: source
        timeout-minutes: 4
        env:
          SOURCE_HEAD: a3011aec9bbcf1e27721cdb7980120d04206932a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h80-m07-clearance
          path: |
            source/evidence/h80-m07/*.png
            source/evidence/h80-m07/report.json
          if-no-files-found: error
          retention-days: 7
