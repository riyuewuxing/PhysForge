name: H85 exact immediate parent raw delta
on:
  pull_request:
    branches: ['polish/v31-h84-s02-projector-contrast']
permissions:
  contents: read
  actions: read
jobs:
  delta:
    if: github.event.pull_request.head.ref == 'audit/h85-exact-parent-delta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        phase: [online, offline]
    env:
      GH_TOKEN: ${{ github.token }}
      PHASE: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact runs and retrieve retained artifacts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p inputs review
          for run in 46022936408 46104249470; do
            case "$run:$PHASE" in
              46022936408:online) expected_sha=54859b12382bcacdc471a586f086b2e89685781c; expected_id=15210148340; expected_digest=4fd7f1a9b894e74483cbd3e516ef6bc8c8fcbe6d103ba9ee9206a6013a727b9a ;;
              46022936408:offline) expected_sha=54859b12382bcacdc471a586f086b2e89685781c; expected_id=15210801972; expected_digest=704e14638758f3300e9448d4ed7d2bc51588ededf62f3810f62ac1fcc6ad3e6d ;;
              46104249470:online) expected_sha=3d4cf5062dd464937a558f482b93fd2598c1939c; expected_id=15246967431; expected_digest=f473182b2f78bfab50313b813dc58d2cb16dec99415690bc3178d85422385a2e ;;
              46104249470:offline) expected_sha=3d4cf5062dd464937a558f482b93fd2598c1939c; expected_id=15247445729; expected_digest=a7fca513ea03d10e73c1cf42578bca0ff36b40eafd166ae8b3a7e6bbea612785 ;;
              *) exit 1 ;;
            esac
            state=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$run)
            test "$(jq -r .head_sha <<<"$state")" = "$expected_sha"
            test "$(jq -r .status <<<"$state")" = completed
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100")
            visual=$(jq -ce --arg n "visual ($PHASE)" '[.jobs[]|select(.name==$n)]|if length==1 then .[0] else error("nonunique visual job") end' <<<"$jobs")
            test "$(jq -r .status <<<"$visual")" = completed
            test "$(jq -r .conclusion <<<"$visual")" = success
            meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" | jq -ce --arg n "v31-polish-visual-$PHASE" '[.artifacts[]|select(.name==$n and .expired==false)]|if length==1 then .[0] else error("nonunique or missing raw artifact") end')
            id=$(jq -r .id <<<"$meta")
            digest=$(jq -r .digest <<<"$meta")
            test "$id" = "$expected_id"
            test "${digest#sha256:}" = "$expected_digest"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "inputs/$run.zip"
            echo "${digest#sha256:}  inputs/$run.zip" | sha256sum -c -
            echo "$meta" > "inputs/$run.json"
          done
      - name: Install pinned PNG decoder
        timeout-minutes: 1
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Compare all PNG paths and exact bytes
        timeout-minutes: 2
        run: python scripts/h85_exact_parent_delta.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h85-parent-delta-${{ matrix.phase }}-index
          path: review/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('review/pair-pack-01.zip') != '' }}
