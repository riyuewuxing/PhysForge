name: H86 replay exact H84 raw parent recovery
on:
  pull_request:
    branches: ['polish/v31-h86-parent-evidence-recovery']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.event.pull_request.head.ref == 'audit/h86-failed-parent-replay'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        phase: [online, offline]
    env:
      PHASE: ${{ matrix.phase }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_HEAD: 3d4cf5062dd464937a558f482b93fd2598c1939c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d9c6c3744586befca9342f151abc73bda41886e0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
        timeout-minutes: 1
      - run: python -m unittest discover -s scripts -p test_visual_review_pack.py
        timeout-minutes: 1
      - name: Resolve retained H84 exact source using new implementation
        timeout-minutes: 4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d9c6c3744586befca9342f151abc73bda41886e0
          python scripts/visual_review_pack.py --resolve-base --repo "$GITHUB_REPOSITORY" --head "$RECOVERY_HEAD" --base-branch polish/v31-h84-s02-projector-contrast --phase "$PHASE" --out recovered --prefixes H53_F07,H56_F08,H59_F09,H60_F10,H62_F11,H63_F12
          if [[ "$PHASE" == online ]]; then id=15248223678; digest=9dfb7686ac2706e2d6481b6eac60874fb19713cf9449b5bb4ca94286a48f0eb1; else id=15248522975; digest=1916a3fcd25234b296695bb0009d4f2da1146fe1ab0fcf4435091a866e84e56a; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > previous-index.zip
          echo "$digest  previous-index.zip" | sha256sum -c -
          python - <<'PY'
          import json, os, pathlib, zipfile
          p=os.environ["PHASE"]
          recovered=json.loads(pathlib.Path("recovered/manifest.json").read_text())
          source=recovered["source"]
          assert recovered["head_sha"]==os.environ["RECOVERY_HEAD"] and recovered["phase"]==p
          assert not recovered["errors"] and recovered["baseline_status"]=="NOT_RUN"
          assert source["kind"]=="verified_raw_capture_from_failed_review" and source["run_id"]==46104249470 and source["run_conclusion"]=="failure"
          expected={"online":(469,15246967431,140853326238),"offline":(175,15247445729,140853326477)}[p]
          assert (recovered["count"],source["artifact_id"],source["capture_job_id"])==expected
          with zipfile.ZipFile("previous-index.zip") as z:
              assert z.testzip() is None
              previous=json.loads(z.read("manifest.json"))
          assert previous["head_sha"]==recovered["head_sha"] and previous["phase"]==p
          actual={pathlib.PurePosixPath(r["path"]).name:(r["sha256"],r["size"]) for r in recovered["images"]}
          assert len(actual)==expected[0]
          old={r["path"]:(r["head_sha256"],r["head_size"]) for r in previous["images"]}
          assert actual==old
          print("Verified recovered complete original PNG index matches independent H85 evidence",p,len(actual))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('recovered/manifest.json') != '' }}
        with:
          name: h86-exact-raw-recovery-${{ matrix.phase }}
          path: recovered/manifest.json
          if-no-files-found: error
          retention-days: 7
