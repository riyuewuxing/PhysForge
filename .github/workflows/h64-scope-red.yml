name: H64 legacy offline scope independent red baseline
on:
  push:
    branches: ['audit/v31-h64-scope-red']
permissions:
  contents: read
jobs:
  legacy-scope:
    name: Actual plot text ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        model: [builder-composite-em-field, em-induction-double-rod, stse-em-devices-suite, stse-tokamak-magnetic-mirror, astro-orbital-mechanics]
    env:
      SOURCE_HEAD: '37bc70b5bdeb1088bcd0c866d149cfb34e876da5'
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git diff --name-only "$SOURCE_HEAD" HEAD | sort > /tmp/actual
          printf '%s\n' .github/workflows/h64-scope-red.yml scripts/h64_legacy_scope_audit.mjs | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/h64_legacy_scope_audit.mjs
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-scope-${{ matrix.model }}
          path: |
            evidence/scope/*.png
            evidence/scope/report.json
          if-no-files-found: error
          retention-days: 7
