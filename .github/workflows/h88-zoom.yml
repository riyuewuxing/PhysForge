name: H88 exact-source zoom badge and repeat reset
on:
  pull_request:
    branches: ['polish/v31-h88-title-audit-trigger']
permissions:
  contents: read
jobs:
  audit:
    if: startsWith(github.event.pull_request.head.ref, 'audit/h88-zoom-coherence')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: 3573504f234b18a93fd6ba6faa5116cd82b7b810
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: |
          test "$(git -C source rev-parse HEAD)" = "3573504f234b18a93fd6ba6faa5116cd82b7b810"
          cp audit/scripts/h88_zoom.mjs source/scripts/
          sha256sum source/scripts/h88_zoom.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: source
      - run: pnpm build
        working-directory: source
        env:
          VITE_BASE_PATH: /PhysForge/
      - run: node scripts/h88_zoom.mjs
        working-directory: source
        timeout-minutes: 5
        env:
          SOURCE_HEAD: 3573504f234b18a93fd6ba6faa5116cd82b7b810
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h88-zoom-evidence
          path: |
            source/evidence/h88-zoom/*.png
            source/evidence/h88-zoom/report.json
          if-no-files-found: error
          retention-days: 7
