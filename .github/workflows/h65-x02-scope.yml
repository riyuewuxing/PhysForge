name: H65 X02 stale scope contract
on:
  push:
    branches: [audit/v31-h65-x02-scope-red, audit/v31-h65-x02-scope-green]
permissions:
  contents: read
jobs:
  x02-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: echo "SOURCE_HEAD=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/h65_x02_scope_audit.mjs
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x02-scope-evidence
          path: |
            evidence/x02-scope/*.png
            evidence/x02-scope/report.json
          if-no-files-found: error
          retention-days: 7
