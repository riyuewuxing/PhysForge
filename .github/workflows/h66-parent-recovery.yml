name: H66 exact parent visual evidence recovery
on:
  push:
    branches: [audit/v31-h66-exact-parent]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Exact parent recovery (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        phase: [online, offline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          test "$(git rev-parse HEAD^)" = "684e382682770a4a30664c437de92143ece77269"
          git diff --name-only HEAD^ HEAD | sort > /tmp/changed
          printf '%s\n' .github/workflows/h66-parent-recovery.yml scripts/h66_parent_recovery.py | sort | diff - /tmp/changed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
        timeout-minutes: 2
      - run: python scripts/h66_parent_recovery.py
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h66-parent-evidence-${{ matrix.phase }}
          path: evidence/h66-parent/
          if-no-files-found: error
          retention-days: 7
