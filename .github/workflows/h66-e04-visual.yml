name: H66 E04 independent visual material and contrast
on:
  push:
    branches: [audit/v31-h66-e04-visual-red, audit/v31-h66-e04-visual-green]
permissions:
  contents: read
jobs:
  e04:
    name: E04 actual canvas (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        phase: [online, offline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          git diff --name-only HEAD^ HEAD | sort > /tmp/changed
          printf '%s\n' .github/workflows/h66-e04-visual.yml scripts/h66_e04_visual_contract.mjs | sort | diff - /tmp/changed
          echo "SOURCE_HEAD=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        if: matrix.phase == 'online'
        env:
          VITE_BASE_PATH: /PhysForge/
        timeout-minutes: 3
      - run: node scripts/h66_e04_visual_contract.mjs
        timeout-minutes: 4
        env:
          PHASE: ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h66-e04-${{ matrix.phase }}
          path: |
            evidence/e04-gold/*.png
            evidence/e04-gold/reference/*.png
            evidence/e04-gold/report.json
          if-no-files-found: error
          retention-days: 7
