name: H65 independent offline scope transitions
on:
  push:
    branches: [audit/v31-h65-scope-mode-transitions]
permissions:
  contents: read
jobs:
  transitions:
    name: Scope transitions ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        model: [builder-composite-em-field, em-induction-double-rod, stse-em-devices-suite, stse-tokamak-magnetic-mirror, astro-orbital-mechanics]
    env:
      MODEL: ${{ matrix.model }}
      SOURCE_HEAD: aba0089096b290245af9da1914740e78494b4b43
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git diff --name-only HEAD^ HEAD | sort > /tmp/changed
          printf '%s\n' .github/workflows/h65-scope-transitions.yml scripts/h65_scope_transitions.mjs | sort | diff - /tmp/changed
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/h65_scope_transitions.mjs
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scope-transitions-${{ matrix.model }}
          path: |
            evidence/scope-transitions/*.png
            evidence/scope-transitions/report.json
          if-no-files-found: error
          retention-days: 7
