name: H88 E02 E05 actual panel reachability
on:
  pull_request:
    branches: ['polish/v31-h88-o01-safe-view']
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event.pull_request.head.ref == 'audit/h88-panel-reachability'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: safe
            sha: c03924f4cc7778a008bd957478c55e54de602a09
    env:
      SOURCE_HEAD: ${{ matrix.sha }}
      SOURCE_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          cp audit/scripts/h88_panel_reachability.mjs source/scripts/
          git -C source diff --exit-code
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: source
      - run: pnpm build
        working-directory: source
        env:
          VITE_BASE_PATH: /PhysForge/
      - run: node scripts/h88_panel_reachability.mjs
        working-directory: source
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h88-panel-reachability-${{ matrix.role }}
          path: source/evidence/h88-panel-reachability/
          if-no-files-found: error
          retention-days: 7
