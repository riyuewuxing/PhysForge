name: H68 B2 actual divider and material contract
on:
  push:
    branches: [audit/v31-h68-b2-red, audit/v31-h68-b2-green]
permissions:
  contents: read
jobs:
  b2:
    name: B2 actual divider (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        phase: [online, offline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          git diff --name-only HEAD^ HEAD | sort > /tmp/changed
          printf '%s\n' .github/workflows/h68-b2-contract.yml scripts/h68_b2_contract.mjs | sort | diff - /tmp/changed
          echo "SOURCE_HEAD=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        if: matrix.phase == 'online'
        env:
          VITE_BASE_PATH: /PhysForge/
        timeout-minutes: 3
      - run: node scripts/h68_b2_contract.mjs
        timeout-minutes: 5
        env:
          PHASE: ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h68-b2-${{ matrix.phase }}
          path: |
            evidence/b2-divider/*.png
            evidence/b2-divider/reference/*.png
            evidence/b2-divider/report.json
          if-no-files-found: error
          retention-days: 7
